# Crawl4AI CI/CD Pipeline
# Builds and deploys the crawl4ai service

variables:
  CRAWL4AI_IMAGE: $CI_REGISTRY_IMAGE/crawl4ai

# Build crawl4ai Docker image
build:crawl4ai:
  stage: build
  image: docker:24
  services: []
  variables:
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      set -euo pipefail
      echo "🔨 Building crawl4ai image..."
      docker build -t $CRAWL4AI_IMAGE:$CI_COMMIT_SHORT_SHA -t $CRAWL4AI_IMAGE:latest ./crawl4ai
      echo "📤 Pushing images..."
      docker push $CRAWL4AI_IMAGE:$CI_COMMIT_SHORT_SHA
      docker push $CRAWL4AI_IMAGE:latest
      echo "✅ crawl4ai built and pushed"
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - crawl4ai/**/*
        - .gitlab-ci.yml

# Deploy to staging
deploy-staging:crawl4ai:
  stage: deploy-staging
  image: docker:24
  services: []
  variables:
    DOCKER_HOST: unix:///var/run/docker-staging.sock
    NETWORK_NAME: ai_center_staging
    CONTAINER_NAME_PREFIX: ai_center_staging
    CRAWL4AI_PORT: 11235
  environment:
    name: staging
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      set -euo pipefail
      echo "🚀 Deploying crawl4ai to staging..."
      docker pull $CRAWL4AI_IMAGE:$CI_COMMIT_SHORT_SHA
      cd crawl4ai
      docker compose up -d
      echo "✅ crawl4ai deployed to staging"
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
      changes:
        - crawl4ai/**/*
        - .gitlab-ci.yml

# Deploy to production
deploy-prod:crawl4ai:
  stage: deploy-prod
  image: docker:24
  services: []
  variables:
    DOCKER_HOST: unix:///var/run/docker-prod.sock
    NETWORK_NAME: ai_center_prod
    CONTAINER_NAME_PREFIX: ai_center_prod
    CRAWL4AI_PORT: 11235
  environment:
    name: production
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      set -euo pipefail
      echo "🚀 Deploying crawl4ai to production..."
      docker pull $CRAWL4AI_IMAGE:$CI_COMMIT_SHORT_SHA
      cd crawl4ai
      docker compose up -d
      echo "✅ crawl4ai deployed to production"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - crawl4ai/**/*
        - .gitlab-ci.yml
