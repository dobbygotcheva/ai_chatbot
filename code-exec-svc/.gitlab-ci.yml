# Code Execution Service CI/CD Pipeline
# Builds and deploys the code-exec-svc service with internal DinD

variables:
  CODE_EXEC_SVC_IMAGE: $CI_REGISTRY_IMAGE/code-exec-svc
  CODE_EXEC_PYTHON_IMAGE: $CI_REGISTRY_IMAGE/code-exec-python
  CODE_EXEC_NODE_IMAGE: $CI_REGISTRY_IMAGE/code-exec-node
  CODE_EXEC_BASH_IMAGE: $CI_REGISTRY_IMAGE/code-exec-bash

# Build code-exec-svc Docker images (service + 3 runtimes)
build:code-exec-svc:
  stage: build
  image: docker:24
  services: []
  variables:
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      set -euo pipefail
      echo "🔨 Building code-exec-svc images..."
      
      # Build service image
      docker build -t $CODE_EXEC_SVC_IMAGE:$CI_COMMIT_SHORT_SHA -t $CODE_EXEC_SVC_IMAGE:latest ./code-exec-svc
      
      # Build runtime images
      docker build -t $CODE_EXEC_PYTHON_IMAGE:$CI_COMMIT_SHORT_SHA -t $CODE_EXEC_PYTHON_IMAGE:latest -f code-exec-svc/runtimes/python/Dockerfile code-exec-svc/runtimes/python
      docker build -t $CODE_EXEC_NODE_IMAGE:$CI_COMMIT_SHORT_SHA -t $CODE_EXEC_NODE_IMAGE:latest -f code-exec-svc/runtimes/javascript/Dockerfile code-exec-svc/runtimes/javascript
      docker build -t $CODE_EXEC_BASH_IMAGE:$CI_COMMIT_SHORT_SHA -t $CODE_EXEC_BASH_IMAGE:latest -f code-exec-svc/runtimes/bash/Dockerfile code-exec-svc/runtimes/bash
      
      echo "📤 Pushing images..."
      docker push $CODE_EXEC_SVC_IMAGE:$CI_COMMIT_SHORT_SHA
      docker push $CODE_EXEC_SVC_IMAGE:latest
      docker push $CODE_EXEC_PYTHON_IMAGE:$CI_COMMIT_SHORT_SHA
      docker push $CODE_EXEC_PYTHON_IMAGE:latest
      docker push $CODE_EXEC_NODE_IMAGE:$CI_COMMIT_SHORT_SHA
      docker push $CODE_EXEC_NODE_IMAGE:latest
      docker push $CODE_EXEC_BASH_IMAGE:$CI_COMMIT_SHORT_SHA
      docker push $CODE_EXEC_BASH_IMAGE:latest
      
      echo "✅ code-exec-svc images built and pushed"
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - code-exec-svc/**/*
        - .gitlab-ci.yml

# Deploy to staging
deploy-staging:code-exec-svc:
  stage: deploy-staging
  image: docker:24
  services: []
  variables:
    DOCKER_HOST: unix:///var/run/docker-staging.sock
    NETWORK_NAME: ai_center_staging
    CONTAINER_NAME_PREFIX: ai_center_staging
    CODE_EXEC_PORT: 5001
  environment:
    name: staging
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      set -euo pipefail
      echo "🚀 Deploying code-exec-svc to staging..."
      
      # Pull service image
      docker pull $CODE_EXEC_SVC_IMAGE:$CI_COMMIT_SHORT_SHA
      
      # Pull runtime images to host
      echo "📦 Pulling runtime images..."
      docker pull $CODE_EXEC_PYTHON_IMAGE:$CI_COMMIT_SHORT_SHA
      docker pull $CODE_EXEC_NODE_IMAGE:$CI_COMMIT_SHORT_SHA
      docker pull $CODE_EXEC_BASH_IMAGE:$CI_COMMIT_SHORT_SHA
      
      # Deploy compose (starts dind)
      cd code-exec-svc
      docker compose up -d
      
      # Wait for dind to be healthy
      echo "⏳ Waiting for dind to be ready..."
      sleep 10
      
      # Load runtime images INTO dind daemon
      echo "📥 Loading images into dind daemon..."
      docker save $CODE_EXEC_PYTHON_IMAGE:$CI_COMMIT_SHORT_SHA | docker exec -i ${CONTAINER_NAME_PREFIX:-ai_center}_code_exec_dind docker load
      docker save $CODE_EXEC_NODE_IMAGE:$CI_COMMIT_SHORT_SHA | docker exec -i ${CONTAINER_NAME_PREFIX:-ai_center}_code_exec_dind docker load
      docker save $CODE_EXEC_BASH_IMAGE:$CI_COMMIT_SHORT_SHA | docker exec -i ${CONTAINER_NAME_PREFIX:-ai_center}_code_exec_dind docker load
      
      # Tag inside dind with simple names
      docker exec -i ${CONTAINER_NAME_PREFIX:-ai_center}_code_exec_dind docker tag $CODE_EXEC_PYTHON_IMAGE:$CI_COMMIT_SHORT_SHA code-exec-python:latest
      docker exec -i ${CONTAINER_NAME_PREFIX:-ai_center}_code_exec_dind docker tag $CODE_EXEC_NODE_IMAGE:$CI_COMMIT_SHORT_SHA code-exec-node:latest
      docker exec -i ${CONTAINER_NAME_PREFIX:-ai_center}_code_exec_dind docker tag $CODE_EXEC_BASH_IMAGE:$CI_COMMIT_SHORT_SHA code-exec-bash:latest
      
      # Restart code-exec-svc so it sees the images
      docker compose restart code-exec-svc
      echo "✅ code-exec-svc deployed to staging"
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
      changes:
        - code-exec-svc/**/*
        - .gitlab-ci.yml

# Deploy to production
deploy-prod:code-exec-svc:
  stage: deploy-prod
  image: docker:24
  services: []
  variables:
    DOCKER_HOST: unix:///var/run/docker-prod.sock
    NETWORK_NAME: ai_center_prod
    CONTAINER_NAME_PREFIX: ai_center_prod
    CODE_EXEC_PORT: 5002
  environment:
    name: production
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      set -euo pipefail
      echo "🚀 Deploying code-exec-svc to production..."
      
      # Pull service image
      docker pull $CODE_EXEC_SVC_IMAGE:$CI_COMMIT_SHORT_SHA
      
      # Pull runtime images to host
      echo "📦 Pulling runtime images..."
      docker pull $CODE_EXEC_PYTHON_IMAGE:$CI_COMMIT_SHORT_SHA
      docker pull $CODE_EXEC_NODE_IMAGE:$CI_COMMIT_SHORT_SHA
      docker pull $CODE_EXEC_BASH_IMAGE:$CI_COMMIT_SHORT_SHA
      
      # Deploy compose (starts dind)
      cd code-exec-svc
      docker compose up -d
      
      # Wait for dind to be healthy
      echo "⏳ Waiting for dind to be ready..."
      sleep 10
      
      # Load runtime images INTO dind daemon
      echo "📥 Loading images into dind daemon..."
      docker save $CODE_EXEC_PYTHON_IMAGE:$CI_COMMIT_SHORT_SHA | docker exec -i ${CONTAINER_NAME_PREFIX:-ai_center}_code_exec_dind docker load
      docker save $CODE_EXEC_NODE_IMAGE:$CI_COMMIT_SHORT_SHA | docker exec -i ${CONTAINER_NAME_PREFIX:-ai_center}_code_exec_dind docker load
      docker save $CODE_EXEC_BASH_IMAGE:$CI_COMMIT_SHORT_SHA | docker exec -i ${CONTAINER_NAME_PREFIX:-ai_center}_code_exec_dind docker load
      
      # Tag inside dind with simple names
      docker exec -i ${CONTAINER_NAME_PREFIX:-ai_center}_code_exec_dind docker tag $CODE_EXEC_PYTHON_IMAGE:$CI_COMMIT_SHORT_SHA code-exec-python:latest
      docker exec -i ${CONTAINER_NAME_PREFIX:-ai_center}_code_exec_dind docker tag $CODE_EXEC_NODE_IMAGE:$CI_COMMIT_SHORT_SHA code-exec-node:latest
      docker exec -i ${CONTAINER_NAME_PREFIX:-ai_center}_code_exec_dind docker tag $CODE_EXEC_BASH_IMAGE:$CI_COMMIT_SHORT_SHA code-exec-bash:latest
      
      # Restart code-exec-svc so it sees the images
      docker compose restart code-exec-svc
      echo "✅ code-exec-svc deployed to production"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - code-exec-svc/**/*
        - .gitlab-ci.yml
