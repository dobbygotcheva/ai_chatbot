# AI Chatbot CI/CD Pipeline
# Builds and deploys the ai_chatbot service

variables:
  CHATBOT_IMAGE: $CI_REGISTRY_IMAGE/ai_chatbot

# Build ai_chatbot Docker image
build:ai_chatbot:
  stage: build
  image: docker:24
  services: []
  variables:
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      set -euo pipefail
      echo "🔨 Building ai_chatbot image..."
      docker build -t $CHATBOT_IMAGE:$CI_COMMIT_SHORT_SHA -t $CHATBOT_IMAGE:latest ./ai_chatbot
      echo "📤 Pushing images..."
      docker push $CHATBOT_IMAGE:$CI_COMMIT_SHORT_SHA
      docker push $CHATBOT_IMAGE:latest
      echo "✅ ai_chatbot built and pushed"
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ai_chatbot/**/*

# Deploy to staging
deploy-staging:ai_chatbot:
  stage: deploy-staging
  image: docker:24
  services: []
  variables:
    DOCKER_HOST: unix:///var/run/docker-staging.sock
    NETWORK_NAME: ai_center_staging
    CONTAINER_NAME_PREFIX: ai_center_staging
    SERVICE_PORT: 3001
    POSTGRES_URL: postgresql://postgres:postgres@ai_center_staging_postgres:5432/ai_chatbot
    QDRANT_URL: http://ai_center_staging_qdrant:6333
    CRAWLER_URL: http://ai_center_staging_crawl4ai:11235/crawl
    ATLASSIAN_MCP: http://ai_center_staging_mcp_atlassian:8000/mcp
    CODE_EXECUTION_SERVICE_URL: http://ai_center_staging_code_exec_svc:5001
    SEARXNG_URL: http://ai_center_staging_searxng:8001
    AUTH_SECRET: $AUTH_SECRET_STAGING
    AUTH_URL: $AUTH_URL_STAGING
    AUTH_EMAIL_GROUPS: $AUTH_EMAIL_GROUPS_STAGING
    PROVIDER_API_KEY: $PROVIDER_API_KEY_STAGING
    PROVIDER_BASE_URL: $PROVIDER_BASE_URL_STAGING
    PROVIDER_MODEL: $PROVIDER_MODEL_STAGING
    PROVIDER_TITLE_MODEL: $PROVIDER_MODEL_STAGING
    PROVIDER_ARTIFACT_MODEL: $PROVIDER_MODEL_STAGING
    PROVIDER_REASONING_MODEL: $PROVIDER_MODEL_STAGING
    PROVIDER_EMBEDDING_MODEL: $PROVIDER_EMBEDDING_MODEL_STAGING
    ENCRYPTION_KEY: $ENCRYPTION_KEY_STAGING
    AZURE_AD_TENANT_ID: $AZURE_AD_TENANT_ID_STAGING
    AZURE_AD_CLIENT_ID: $AZURE_AD_CLIENT_ID_STAGING
    AZURE_AD_CLIENT_SECRET: $AZURE_AD_CLIENT_SECRET_STAGING
  environment:
    name: staging
    url: https://ai-center-test.egt.com
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      set -euo pipefail
      echo "🚀 Deploying ai_chatbot to staging..."
      docker pull $CHATBOT_IMAGE:$CI_COMMIT_SHORT_SHA
      cd ai_chatbot
      docker compose up -d
      echo "✅ ai_chatbot deployed to staging"
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
      changes:
        - ai_chatbot/**/*
        - .gitlab-ci.yml

# Deploy to production
deploy-prod:ai_chatbot:
  stage: deploy-prod
  image: docker:24
  services: []
  variables:
    DOCKER_HOST: unix:///var/run/docker-prod.sock
    NETWORK_NAME: ai_center_prod
    CONTAINER_NAME_PREFIX: ai_center_prod
    SERVICE_PORT: 3000
    POSTGRES_URL: postgresql://postgres:postgres@ai_center_prod_postgres:5432/ai_chatbot_prod
    QDRANT_URL: http://ai_center_prod_qdrant:6333
    CRAWLER_URL: http://ai_center_prod_crawl4ai:11235/crawl
    ATLASSIAN_MCP: http://ai_center_prod_mcp_atlassian:8000/mcp
    CODE_EXECUTION_SERVICE_URL: http://ai_center_prod_code_exec_svc:5001
    SEARXNG_URL: http://ai_center_prod_searxng:8001
    AUTH_SECRET: $AUTH_SECRET_PROD
    AUTH_URL: $AUTH_URL_PROD
    AUTH_EMAIL_GROUPS: $AUTH_EMAIL_GROUPS_PROD
    PROVIDER_API_KEY: $PROVIDER_API_KEY_PROD
    PROVIDER_BASE_URL: $PROVIDER_BASE_URL_PROD
    PROVIDER_MODEL: $PROVIDER_MODEL_PROD
    PROVIDER_TITLE_MODEL: $PROVIDER_MODEL_PROD
    PROVIDER_ARTIFACT_MODEL: $PROVIDER_MODEL_PROD
    PROVIDER_REASONING_MODEL: $PROVIDER_MODEL_PROD
    PROVIDER_EMBEDDING_MODEL: $PROVIDER_EMBEDDING_MODEL_PROD
    ENCRYPTION_KEY: $ENCRYPTION_KEY_PROD
    AZURE_AD_TENANT_ID: $AZURE_AD_TENANT_ID_PROD
    AZURE_AD_CLIENT_ID: $AZURE_AD_CLIENT_ID_PROD
    AZURE_AD_CLIENT_SECRET: $AZURE_AD_CLIENT_SECRET_PROD
  environment:
    name: production
    url: https://ai-center.egt.com
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      set -euo pipefail
      echo "🚀 Deploying ai_chatbot to production..."
      docker pull $CHATBOT_IMAGE:$CI_COMMIT_SHORT_SHA
      cd ai_chatbot
      docker compose up -d
      echo "✅ ai_chatbot deployed to production"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ai_chatbot/**/*
        - .gitlab-ci.yml
