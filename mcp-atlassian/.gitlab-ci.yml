# MCP Atlassian CI/CD Pipeline
# Builds and deploys the mcp-atlassian service

variables:
  MCP_ATLASSIAN_IMAGE: $CI_REGISTRY_IMAGE/mcp-atlassian

# Build mcp-atlassian Docker image
build:mcp-atlassian:
  stage: build
  image: docker:24
  services: []
  variables:
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      set -euo pipefail
      echo "🔨 Building mcp-atlassian image..."
      docker build -t $MCP_ATLASSIAN_IMAGE:$CI_COMMIT_SHORT_SHA -t $MCP_ATLASSIAN_IMAGE:latest ./mcp-atlassian
      echo "📤 Pushing images..."
      docker push $MCP_ATLASSIAN_IMAGE:$CI_COMMIT_SHORT_SHA
      docker push $MCP_ATLASSIAN_IMAGE:latest
      echo "✅ mcp-atlassian built and pushed"
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - mcp-atlassian/**/*
        - .gitlab-ci.yml

# Deploy to staging
deploy-staging:mcp-atlassian:
  stage: deploy-staging
  image: docker:24
  services: []
  variables:
    DOCKER_HOST: unix:///var/run/docker-staging.sock
    NETWORK_NAME: ai_center_staging
    CONTAINER_NAME_PREFIX: ai_center_staging
    MCP_ATLASSIAN_PORT: 8000
    CONFLUENCE_URL: https://confluence-test.egt.com/
    JIRA_URL: https://jira-test.egt.com/
    MCP_ALLOWED_URL_DOMAINS: $MCP_ALLOWED_URL_DOMAINS
  environment:
    name: staging
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      set -euo pipefail
      echo "🚀 Deploying mcp-atlassian to staging..."
      docker pull $MCP_ATLASSIAN_IMAGE:$CI_COMMIT_SHORT_SHA
      cd mcp-atlassian
      docker compose up -d
      echo "✅ mcp-atlassian deployed to staging"
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
      changes:
        - mcp-atlassian/**/*
        - .gitlab-ci.yml

# Deploy to production
deploy-prod:mcp-atlassian:
  stage: deploy-prod
  image: docker:24
  services: []
  variables:
    DOCKER_HOST: unix:///var/run/docker-prod.sock
    NETWORK_NAME: ai_center_prod
    CONTAINER_NAME_PREFIX: ai_center_prod
    MCP_ATLASSIAN_PORT: 8000
    CONFLUENCE_URL: https://confluence.egt.com/
    JIRA_URL: https://jira.egt.com/
    MCP_ALLOWED_URL_DOMAINS: $MCP_ALLOWED_URL_DOMAINS
  environment:
    name: production
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      set -euo pipefail
      echo "🚀 Deploying mcp-atlassian to production..."
      docker pull $MCP_ATLASSIAN_IMAGE:$CI_COMMIT_SHORT_SHA
      cd mcp-atlassian
      docker compose up -d
      echo "✅ mcp-atlassian deployed to production"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - mcp-atlassian/**/*
        - .gitlab-ci.yml
