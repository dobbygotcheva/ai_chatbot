# Code Execution Service
# Usage: docker compose up -d
# Uses internal DinD, no host socket mount

services:
  code-exec-dind:
    image: docker:25-dind
    privileged: true
    container_name: ${CONTAINER_NAME_PREFIX:-ai_center}_code_exec_dind
    environment:
      - DOCKER_TLS_CERTDIR=
    volumes:
      - code_exec_dind_data:/var/lib/docker
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '${DIND_CPU_LIMIT:-2.0}'
          memory: ${DIND_MEMORY_LIMIT:-2G}
        reservations:
          cpus: '${DIND_CPU_RESERVATION:-0.5}'
          memory: ${DIND_MEMORY_RESERVATION:-512M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "false"

  code-exec-svc:
    image: ${CI_REGISTRY_IMAGE:-rd-gitlab.egt-bg.com:4567/sm/ai_center}/code-exec-svc:${CI_COMMIT_SHORT_SHA:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: always
    container_name: ${CONTAINER_NAME_PREFIX:-ai_center}_code_exec_svc
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5001
      - DOCKER_HOST=tcp://${CONTAINER_NAME_PREFIX:-ai_center}_code_exec_dind:2375
    networks:
      - app_network
    depends_on:
      code-exec-dind:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '${CODE_EXEC_CPU_LIMIT:-2.0}'
          memory: ${CODE_EXEC_MEMORY_LIMIT:-1G}
        reservations:
          cpus: '${CODE_EXEC_CPU_RESERVATION:-0.5}'
          memory: ${CODE_EXEC_MEMORY_RESERVATION:-256M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "false"

networks:
  app_network:
    name: ${NETWORK_NAME:-ai_center}
    driver: bridge

volumes:
  code_exec_dind_data:
